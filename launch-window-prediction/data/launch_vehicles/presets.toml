# Каталог ракет-носителей (Presets). Встроен в программу при сборке.
# Та же гибридная схема, что у лунных аппаратов: шаблон -> переопределение -> свой профиль
# в data/launch_vehicles/custom/.
#
# В каталог попадают только ракеты, для которых в открытых источниках есть грузоподъёмность
# к Луне (TLI) и параметры разгонной ступени, выполняющей разгон к Луне.
#
# Поля:
#   spaceports                  - космодромы (id из data/spaceports.toml), откуда летает ракета;
#                                 пользовательская ракета (свой профиль или шаблон с изменениями)
#                                 стартует с любого космодрома, это поле у неё не учитывается
#   payload_tli_kg              - масса, которую ракета отправляет к Луне (TLI), кг
#   payload_leo_kg / _gto_kg    - справочно, кг
#   upper_stage_*               - разгонная ступень: сухая масса, топливо, тяга, Isp
#   ascent_duration_s, max_coast_s, parking_altitude_km - необязательно (если известно)
#   [preset.ascent]             - ступени для моделирования подъёма до опорной орбиты (src/ascent.rs):
#       boosters                - ускорители со старта (count - число, массы и тяга - на один блок);
#                                 у твердотопливных - burn_time_s и thrust_profile
#                                 (доля времени, доля наибольшей тяги), наибольшая тяга
#                                 вычисляется из массы топлива и Isp
#       stages                  - ступени по порядку, первая включается на старте
#       upper_stage_in_ascent   - разгонная ступень (upper_stage_*) довыводит на орбиту
#       fairing_mass_kg         - сбрасываемый обтекатель, fairing_jettison_altitude_km - высота сброса
#   Значения, помеченные "ДОПУЩЕНИЕ", не опубликованы и оценены (см. комментарий у значения).

[[preset]]
id = "sls_block1"
name = "SLS Block 1 (ICPS)"
spaceports = ["ksc"]
payload_tli_kg = 27000.0
upper_stage_name = "ICPS (RL10B-2)"
upper_stage_dry_mass_kg = 3800.0
upper_stage_propellant_kg = 28948.0   # полная масса 32 748 кг минус сухая 3 800 кг
upper_stage_thrust_n = 110100.0
upper_stage_isp_s = 462.0
source = "TLI 27 t: NASA, 'Space Launch System Update' (SciTech 2024, NTRS 20230017105). ICPS: Wikipedia 'Delta Cryogenic Second Stage' (5 m ICPS: empty 3,800 kg, gross 32,748 kg, RL10B-2 110.1 kN, Isp 462 s)."

[preset.ascent]
upper_stage_in_ascent = true
upper_stage_diameter_m = 5.1
fairing_mass_kg = 0.0          # груз - лунный аппарат без обтекателя (Orion и САС в модель не входят)
vertical_rise_s = 7.0
stage_coast_s = 6.0
pitch_kick_deg = 2.0
source = "Wikipedia 'Space Launch System' (SRB: 730 t gross, 14.6/16 MN SL/vac, Isp 269 s, 126 s; core: 97,940 kg empty, 144 t LH2 + 840 t LOX, 7.4/9.1 MN, Isp 366/452 s, 8.4 m). NASA 'Artemis I Mission Timeline' (max-Q 1:10, SRB sep 2:12, MECO 8:03). SRB propellant 631 t and thrust profile shape: ASSUMPTION (five-segment booster ~1.4 Mlb propellant, regressive-progressive grain)."

[preset.ascent.boosters]
name = "5-segment SRB"
count = 2
dry_mass_kg = 99000.0          # 730 t полная масса - 631 t топлива (ДОПУЩЕНИЕ по массе топлива)
propellant_kg = 631000.0       # ДОПУЩЕНИЕ: ~1.4 млн фунтов
isp_vac_s = 269.0
isp_sl_s = 245.5               # из отношения тяги у земли и в пустоте 14.6 / 16 МН
burn_time_s = 126.0
# ДОПУЩЕНИЕ: форма профиля тяги пятисегментного ускорителя (провал на максимальном напоре).
thrust_profile = [[0.0, 0.95], [0.05, 1.0], [0.18, 0.97], [0.36, 0.80], [0.5, 0.78], [0.64, 0.84], [0.8, 0.74], [0.9, 0.5], [0.96, 0.18], [1.0, 0.0]]
diameter_m = 3.71

[[preset.ascent.stages]]
