# Параметры видимости Солнца и Земли (модуль src/visibility.rs).
# Любой параметр можно удалить: тогда используется значение по умолчанию (указано в комментарии).
# Опечатка в имени параметра даёт ошибку при запуске, а не молча игнорируется.

[horizon]
# Высота наблюдателя (солнечной панели, антенны) над поверхностью, м. По умолчанию 2.0.
observer_height_m = 2.0
# Насколько далеко учитывать рельеф, км. По умолчанию 300.0.
# Высокие горы видны издалека, поэтому меньше 150 км ставить не стоит.
max_range_km = 300.0
# Число направлений по азимуту. 720 = шаг 0.5 градуса. По умолчанию 720.
azimuths = 720

# Правило видимости для Солнца.
# criterion: "centre"    - центр диска над рельефом (по умолчанию);
#            "any_part"  - хотя бы край диска над рельефом;
#            "full_disc" - весь диск над рельефом.
# min_clearance_deg: дополнительный запас над рельефом, градусы. По умолчанию 0.0.
[sun]
criterion = "centre"
min_clearance_deg = 0.0

# Правило видимости для Земли (прямая радиосвязь).
# Для антенны обычно задают минимальный угол места через min_clearance_deg.
[earth]
criterion = "centre"
min_clearance_deg = 0.0
