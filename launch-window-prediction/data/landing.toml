# Требования к посадочной площадке (модуль src/landing.rs).
# Любой параметр можно удалить: тогда используется значение по умолчанию (указано в комментарии).
# Опечатка в имени параметра даёт ошибку при запуске.
#
# Вердикты:
#   UNSUITABLE   - уклон больше допустимого уже на доступной карте: сесть нельзя,
#                  дальнейшие расчёты для точки не выполняются;
#   NOT VERIFIED - на карте нарушений не видно, но она слишком грубая, чтобы утверждать «можно»;
#   SUITABLE     - нарушений нет, и карта достаточно подробная (валуны не проверяются);
#   NOT CHECKED  - часть области не покрыта картами.

# Максимально допустимый уклон, градусы. По умолчанию 10.0
# (требование к площадкам Artemis в материалах NASA).
max_slope_deg = 10.0

# Размах посадочных опор аппарата, м. По умолчанию 5.0 (допущение, уточнить под аппарат).
# На этой базе меряется уклон; если пиксель карты крупнее, то на базе пикселя.
footprint_m = 5.0

# Радиус проверяемой области вокруг точки, м. По умолчанию 50.0
# (точность посадки пилотируемого аппарата Artemis: 100 x 100 м).
check_radius_m = 50.0

# Карта с пикселем не крупнее этого значения достаточна для вердикта SUITABLE, м. По умолчанию 10.0.
# Уклон меряется по соседним пикселям, поэтому на карте 10 м база уклона 20 м.
max_verified_resolution_m = 10.0

# Допустимая доля области с уклоном выше max_slope_deg, от 0 до 1. По умолчанию 0.0:
# вся область должна быть пологой (строго). Например, 0.05 допускает 5 % крутых точек,
# если аппарат умеет уводить посадку от препятствий.
max_steep_fraction = 0.0
