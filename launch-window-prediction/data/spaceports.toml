# Космодромы для запуска. Источник координат: файл "Космопорты по миру для запуска ракеты" (проект).
# Координаты: десятичные градусы, датум WGS84 (предположение: в исходном файле не указан).
# lat: + север / - юг. lon: + восток / - запад.
#
# Ограничения на пуск (необязательные поля, у каждого указан источник в limits_source):
#   azimuth_min_deg / azimuth_max_deg  - допустимые азимуты пуска (0 = север, 90 = восток);
#   inclination_min_deg / _max_deg     - допустимый диапазон наклонений орбиты;
#   allowed_inclinations_deg           - отдельные коридоры наклонений (поля падения ступеней),
#                                        сравниваются с допуском 1 градус.
# Если ограничений нет, разрешён любой пуск на восток.
#
# ЕЩЁ НЕ ЗАПОЛНЕНО: altitude_m (высота площадки) - нет в исходном файле.

[[spaceport]]
id = "ksc"
name = "Kennedy Space Center"
pads = ["LC-39A", "LC-39B"]
country = "USA"
lat_deg = 28.608389
lon_deg = -80.604333
azimuth_min_deg = 37.0
azimuth_max_deg = 112.0
limits_source = "Eastern Range: 37-112 deg (GlobalSecurity, Eastern Range initiatives); Wikipedia 'Eastern Range' gives 37-114 deg citing 45th Space Wing Launch Site Safety Assessment. Narrower range used."

