# Параметры перелёта Земля -> Луна (модуль src/trajectory/).
# Любой параметр можно удалить: тогда используется значение по умолчанию (указано в комментарии).
# Опечатка в имени параметра даёт ошибку при запуске.

# Тип траектории выбирается при запуске: --trajectory direct|hohmann (в API - поле "trajectory").
# По умолчанию direct. Секция [transfer] - общая для всех траекторий, [direct_transfer] и
# [hohmann] - только свои параметры каждой траектории.

[transfer]
# Высота круговой опорной орбиты Земли, км. По умолчанию 185.0.
parking_altitude_km = 185.0

# Высота круговой окололунной орбиты после торможения, км. По умолчанию 100.0.
lunar_orbit_altitude_km = 100.0

# Допустимое время от старта до разгона к Луне (подъём + опорная орбита), минуты. По умолчанию 20 и 180.
coast_min_min = 20.0
coast_max_min = 180.0

# Подъём от стартового стола до опорной орбиты. Если у ракеты есть данные ступеней
# ([preset.ascent] в data/launch_vehicles/presets.toml), подъём моделируется численно
# (src/ascent.rs), и эти два параметра не используются. Ракета берётся из --rocket, а без него -
# первая ракета каталога с данными ступеней, которая летает с этого космодрома.
# Для остальных космодромов - упрощённый подъём:
# длительность, минуты. По умолчанию 10 (Saturn V - 11 мин 39 с, SLS - около 8 мин);
ascent_duration_min = 10.0
# дальность от космодрома до точки выхода на орбиту по поверхности, км. По умолчанию 2000.
ascent_downrange_km = 2000.0

# Запас наклонения опорной орбиты над минимально возможным, градусы. По умолчанию 0.5.
inclination_margin_deg = 0.5

# Шаг грубого перебора момента прилёта, минуты (затем уточняется до 1 минуты). По умолчанию 30.
search_step_min = 30.0

# Наибольший Δv разгона к Луне, который даёт разгонная ступень ракеты, км/с. По умолчанию 3.3.
# ДОПУЩЕНИЕ до появления параметров ракеты: разгон с опорной орбиты 185 км к Луне требует
# ~3.1-3.2 км/с; варианты дороже отбрасываются (иначе поиск "быстрого" перелёта выбирает
# нереальную геометрию разгона). С ракетой (--rocket) берётся из её параметров.
max_tli_delta_v_km_s = 3.3

# Прямой перелёт (--trajectory direct, src/trajectory/direct.rs): задача Ламберта при любом
# угле перелёта.
[direct_transfer]
# Допустимое время перелёта от разгона к Луне до прилёта, сутки. По умолчанию 2.5 и 5.5.
# Из всех вариантов в этом диапазоне выбирается лучший по критерию ([mission] objective).
tof_min_days = 2.5
tof_max_days = 5.5

# Перелёт Гомана (--trajectory hohmann, src/trajectory/hohmann.rs): разгон по касательной в
# перигее (на опорной орбите, в точке напротив Луны), апогей - у Луны, угол перелёта 180 градусов.
# Время полёта не задаётся: это половина периода эллипса (~4.3-5.5 суток, зависит от расстояния
# до Луны).
[hohmann]
# Допустимое расхождение момента разгона с моментом, который нужен для прилёта по эллипсу
# Гомана, минуты. По умолчанию 2. Разгон возможен только когда аппарат проходит точку напротив
# Луны (раз в виток опорной орбиты); расхождение компенсируется высотой апогея
# (2 мин ~ 70 км). Лучший вариант затем доводится до расхождения меньше секунды.
timing_tolerance_min = 2.0

# Как лунный аппарат (--spacecraft) участвует в перелёте. Без аппарата секция не используется.
[mission]
# Манёвры, которые аппарат выполняет своим топливом: "tli" (разгон к Луне),
# "loi" (торможение у Луны), "descent" (спуск на поверхность). По умолчанию ["loi", "descent"].
spacecraft_maneuvers = ["loi", "descent"]

# Δv спуска с окололунной орбиты на поверхность, м/с. Если строки нет (по умолчанию), Δv считается
# моделированием торможения по массе, тяге и удельному импульсу аппарата (секция [descent]).
# Задайте число, чтобы использовать его вместо моделирования (например, 2053 - номинальная
# проектная величина, Georgia Tech, AIAA-2008-6939).
# descent_delta_v_m_s = 2053.0

# Запас Δv сверх требуемого, проценты. По умолчанию 5.0.
reserve_percent = 5.0

# Что выбирать: "fastest" - самый быстрый перелёт, на который хватает Δv аппарата;
# "min_delta_v" - самый экономичный. По умолчанию "fastest".
objective = "fastest"

# Условия посадки в заданную точку (используются, если указаны --lat/--lon).
# Плоскость окололунной орбиты выбирается при выходе на неё так, чтобы в момент посадки пройти
# над точкой (с учётом вращения Луны и поворота плоскости из-за сжатия Луны). Аппарат сходит с
# орбиты, когда к моменту касания выполнены условия ниже; иначе ждёт следующего витка (~2 ч).
[landing_window]
# Солнце должно быть видно над рельефом в момент посадки. По умолчанию true.
require_sun_visible = true
# Допустимая высота Солнца над ровным горизонтом в момент посадки, градусы. По умолчанию 0 и 20
# (действует, только если require_sun_visible = true)
# (низкое Солнце даёт тени, по которым видны камни и ямы).
sun_elevation_min_deg = 0.0
sun_elevation_max_deg = 20.0
# Земля должна быть видна над рельефом (прямая связь при посадке). По умолчанию true.
require_earth_visible = true
# Наибольшее время на окололунной орбите от прилёта до схода с орбиты (DOI), часы. По умолчанию 48.
max_wait_in_orbit_h = 48.0

# Спуск с окололунной орбиты: сход с орбиты (DOI) -> полвитка по эллипсу -> торможение (PDI) -> касание.
[descent]
# Высота перицентра эллипса спуска, где начинается торможение, км. По умолчанию 15 (как у Apollo).
pdi_altitude_km = 15.0
# Наименьшее время на орбите от прилёта до DOI (проверка систем), часы. По умолчанию 2.
min_time_in_orbit_h = 2.0
# Тяга при торможении в долях от максимальной. По умолчанию 0.94 (основной участок у Apollo:
# 9870 из 10500 фунтов). Торможение моделируется численно: тяга постоянна, её направление
# выводит аппарат на высоту точки посадки с нулевой скоростью.
braking_throttle = 0.94
# Добавка Δv сверх смоделированного торможения - на заход и вертикальный участок у поверхности, м/с.
# По умолчанию 285: автоматический спуск Apollo LM требовал 2081 м/с (NASA, NTRS 19700024568),
# моделирование торможения LM до остановки даёт ~1795 м/с.
terminal_allowance_m_s = 285.0
# Длительность захода и вертикального участка после торможения, с. По умолчанию 185
# (весь автоматический спуск Apollo - 11 мин 20 с, торможение по моделированию ~8 мин 15 с).
terminal_duration_s = 185.0
# Учитывать сжатие Луны при поиске по формулам: поворот плоскости низкой орбиты
# (до ~1.2 град/сутки) и поправку периода. По умолчанию true.
lunar_j2 = true

# Уточнение найденного перелёта численным интегрированием (модуль src/refine.rs).
# Поиск вариантов идёт по формулам; лучший вариант затем пересчитывается шаг за шагом
# со всеми силами сразу, а скорость после разгона к Луне подбирается так, чтобы аппарат
# пришёл на нужную высоту у Луны и остановился над точкой посадки.
[numerical]
# Включить уточнение. По умолчанию true.
enabled = true
# Учитывать сжатие Земли (J2) на опорной орбите и в перелёте. По умолчанию true.
earth_j2 = true
# Учитывать притяжение Солнца. По умолчанию true.
sun_gravity = true
# Неоднородности поля тяготения Луны (масконы): степень разложения модели GRAIL GL0660B,
# от 0 (точечная масса) до 60. По умолчанию 60. Меньше - быстрее, но грубее.
lunar_gravity_degree = 60
# Относительная точность шага интегрирования. По умолчанию 1e-10.
tolerance = 1e-10
# Допустимый промах точки остановки относительно точки посадки, км. По умолчанию 0.1.
landing_tolerance_km = 0.1
# Наибольшее число итераций подбора. По умолчанию 15.
max_iterations = 15
# Уточнять лучший вариант каждого космодрома (true) или только лучший из всех (false).
# Уточнение — самая долгая часть расчёта; при false остальные космодромы показываются
# по формулам. По умолчанию false.
refine_all = false
